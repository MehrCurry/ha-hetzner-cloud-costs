stages:
  - test
  - canary

# Branch + MR pipelines would otherwise both fire for every push on an open MR.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: python:3.13-slim

.uv-sync:
  before_script:
    - pip install -q uv
    - uv sync

# Lint + unit tests against the Home Assistant version pinned in uv.lock.
test:
  extends: .uv-sync
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web"
  script:
    - uv run ruff check .
    - uv run pytest

# Home Assistant ships a new core version monthly. Upgrade to whatever is
# current and run the full suite against it, so a breaking HA change surfaces
# here instead of in the user's production instance. Needs a schedule created
# once in Build > Pipelines > Schedules (GitLab has no in-YAML cron) targeting
# main, e.g. "0 6 3 * *" (3rd of each month).
canary:
  extends: .uv-sync
  stage: canary
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - uv lock --upgrade-package homeassistant --upgrade-package pytest-homeassistant-custom-component
    - uv sync
    - uv run ruff check .
    - uv run pytest

# Files a canary-failure issue if none is open yet. CI_JOB_TOKEN can't create
# issues, so this needs GITLAB_API_TOKEN: a project access token with the
# `api` scope, added as a masked + protected variable under
# Settings > CI/CD > Variables.
canary-report-failure:
  stage: canary
  image: alpine:3.20
  needs: ["canary"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_failure
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_failure
  before_script:
    - apk add --no-cache curl
  script:
    - |
      open_count=$(curl -s --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues?labels=canary-failure&state=opened" \
        | grep -c '"iid"' || true)
      if [ "$open_count" -eq 0 ]; then
        curl -s --request POST --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          --data-urlencode "title=Canary: tests fail against latest Home Assistant" \
          --data-urlencode "labels=canary-failure" \
          --data-urlencode "description=Monthly canary run ($CI_PIPELINE_URL) failed against the latest Home Assistant release. See the job log for the breaking change." \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues"
      fi
