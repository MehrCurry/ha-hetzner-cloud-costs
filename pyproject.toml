[project]
name = "ha-hetzner-cloud-costs"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
]

[dependency-groups]
dev = [
  "homeassistant>=2024.1",
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
